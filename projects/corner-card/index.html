<!doctype html>
<html
  lang="ar"
  data-composition-variables='[
    {"id":"value_text","type":"string","label":"Value (date or figure)","default":"EGP 12,000","maxLength":14},
    {"id":"label_text","type":"string","label":"Label above (Arabic, optional; empty = none)","default":"الراتب الشهري","maxLength":24},
    {"id":"is_money","type":"boolean","label":"Is money (Brass) — off = date/other (Charcoal)","default":true},
    {"id":"corner","type":"enum","label":"Corner","default":"left","options":[{"value":"left","label":"Bottom-left"},{"value":"right","label":"Bottom-right"}]},
    {"id":"hold_duration","type":"number","label":"Hold","default":2.5,"min":1.5,"max":5,"step":0.1,"unit":"s"},
    {"id":"green_screen","type":"boolean","label":"Green-screen fallback (#00FF00, no shadow)","default":false}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>CORNER_CARD — بيزنس مفهوم</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/paper.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        font-weight: 700;
        src: url("assets/fonts/montserrat-700-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 700;
        src: url("assets/fonts/montserrat-700-latin-ext.woff2") format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Cairo";
        font-weight: 700;
        src: url("assets/fonts/cairo-700-arabic.woff2") format("woff2");
        unicode-range:
          U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E,
          U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "Cairo";
        font-weight: 700;
        src: url("assets/fonts/cairo-700-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F, U+FEFF, U+FFFD;
      }

      :root {
        --cream: #f5f0e8;
        --brass: #c9a04a;
        --charcoal: #2c2c2c;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* Fallback plate: flat pure green, no shadow. */
      #root.is-green {
        background: #00ff00;
      }

      /* Center anchor. Unrotated, unshadowed; positioned by corner preset. */
      .cc-anchor {
        position: absolute;
        top: 1560px;
        left: 240px;
        width: 0;
        height: 0;
      }
      .cc-anchor.is-right {
        left: 840px;
      }
      /* Shadow lives on the unrotated mover so it always falls straight down. */
      .cc-mover {
        position: absolute;
        left: -190px;
        top: -120px;
        width: 380px;
        height: 240px;
        filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.4));
      }
      #root.is-green .cc-mover {
        filter: none;
      }
      .cc-card {
        position: absolute;
        inset: 0;
        isolation: isolate;
      }
      .cc-card svg {
        position: absolute;
        inset: 0;
        width: 380px;
        height: 240px;
        overflow: visible;
      }
      .cc-shade {
        mix-blend-mode: multiply;
      }
      .cc-text {
        position: absolute;
        inset: 18px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        text-align: center;
      }
      .cc-label {
        font-family: "Cairo", sans-serif;
        font-weight: 700;
        font-size: 34px;
        line-height: 1.25;
        color: var(--charcoal);
        opacity: 0.7;
        direction: rtl;
        white-space: nowrap;
      }
      .cc-value {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 84px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--charcoal);
        direction: ltr;
        white-space: nowrap;
        display: flex;
        align-items: baseline;
        gap: 0.14em;
      }
      .cc-value.is-money {
        color: var(--brass);
      }
      /* Currency code set small so the figure itself keeps the 84px spec. */
      .cc-unit {
        font-size: 0.4em;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="corner-card"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-marker-sfx="SFX_PAPER@0"
    >
      <div id="cc-anchor" class="cc-anchor">
        <div id="cc-mover" class="cc-mover">
          <div id="cc-card" class="cc-card">
            <svg id="cc-paper" viewBox="0 0 380 240" aria-hidden="true"></svg>
            <div class="cc-text">
              <div id="cc-label" class="cc-label" data-layout-allow-overlap>الراتب الشهري</div>
              <div id="cc-value" class="cc-value" data-layout-allow-overlap>EGP 12,000</div>
            </div>
            <svg id="cc-shade" class="cc-shade" viewBox="0 0 380 240" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const W = 380;
        const H = 240;
        const IN_DUR = 0.35;
        const OUT_DUR = 0.25;
        const REST_ROT = 6;
        const START_ROT = 20;
        const OFFSCREEN_Y = 560; // card top clears the 1920 bottom edge at rot 20°

        const vars = window.__hyperframes.getVariables();
        const valueText = String(vars.value_text ?? "").trim();
        const labelText = String(vars.label_text ?? "").trim();
        const isMoney = vars.is_money === true || vars.is_money === "true";
        const corner = vars.corner === "right" ? "right" : "left";
        const holdRaw = Number(vars.hold_duration);
        const hold = Math.min(5, Math.max(1.5, Number.isFinite(holdRaw) ? holdRaw : 2.5));
        const green = vars.green_screen === true || vars.green_screen === "true";

        const root = document.getElementById("root");
        const anchor = document.getElementById("cc-anchor");
        root.classList.toggle("is-green", green);
        anchor.classList.toggle("is-right", corner === "right");
        const dir = corner === "right" ? 1 : -1; // mirrored tilt

        window.BMPaper.render({
          base: document.getElementById("cc-paper"),
          shade: document.getElementById("cc-shade"),
          width: W,
          height: H,
          seedText: valueText + "|" + labelText,
          idPrefix: "cc-",
        });

        // ---- Text ----
        const labelEl = document.getElementById("cc-label");
        const valueEl = document.getElementById("cc-value");
        labelEl.textContent = labelText;
        labelEl.style.display = labelText ? "" : "none";
        valueEl.classList.toggle("is-money", isMoney);
        valueEl.textContent = "";
        // Split a leading/trailing currency code (EGP, USD, $, ج.م …) into a small unit.
        const m =
          valueText.match(/^([A-Za-z$€£¥]{1,4}|[؀-ۿ.]{1,5})\s*(.+)$/) ||
          valueText.match(/^(.+?)\s*([A-Za-z$€£¥]{1,4}|[؀-ۿ.]{1,5})$/);
        if (isMoney && m && /\d/.test(m[1] + m[2])) {
          const leading = !/\d/.test(m[1]);
          const unit = document.createElement("span");
          unit.className = "cc-unit";
          unit.textContent = leading ? m[1] : m[2];
          const num = document.createElement("span");
          num.textContent = leading ? m[2] : m[1];
          if (leading) valueEl.append(unit, num);
          else valueEl.append(num, unit);
        } else {
          valueEl.textContent = valueText;
        }

        function fitValue() {
          // Keep 84px unless the figure physically overflows the scrap; then shrink.
          const maxW = W - 48;
          let size = 84;
          valueEl.style.fontSize = size + "px";
          while (valueEl.scrollWidth > maxW && size > 52) {
            size -= 2;
            valueEl.style.fontSize = size + "px";
          }
        }

        // Timeline is built and registered synchronously so the render probe sees the
        // full length; only the text fit waits for fonts (it touches no timing).
        const total = IN_DUR + hold + OUT_DUR;
        root.setAttribute("data-duration", total.toFixed(3));
        const tl = gsap.timeline({ paused: true });
        // t=0 → SFX_PAPER marker. IN: flick up from below, −20° → −6°, slight overshoot.
        tl.fromTo(
          "#cc-mover",
          { y: OFFSCREEN_Y },
          { y: 0, duration: IN_DUR, ease: "back.out(1.15)" },
          0,
        );
        tl.fromTo(
          "#cc-card",
          { rotation: dir * START_ROT },
          { rotation: dir * REST_ROT, duration: IN_DUR, ease: "back.out(1.4)" },
          0,
        );
        // HOLD: dead still (no idle wobble). OUT: drop off the bottom, ease-in.
        tl.to("#cc-mover", { y: OFFSCREEN_Y, duration: OUT_DUR, ease: "power2.in" }, IN_DUR + hold);
        window.__timelines["corner-card"] = tl;

        fitValue();
        if (document.fonts && document.fonts.ready) {
          Promise.all([
            document.fonts.load('700 84px "Montserrat"', valueText || "0"),
            document.fonts.load('700 34px "Cairo"', labelText || "ا"),
          ])
            .then(() => document.fonts.ready)
            .then(fitValue, fitValue);
        }
      })();
    </script>
  </body>
</html>
